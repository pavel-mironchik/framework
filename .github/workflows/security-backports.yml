name: Maintained Laravel 11 security

on:
  workflow_dispatch:
  pull_request:
    branches: [11.x]
  push:
    branches: [11.x]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Preserve actual candidate commit on the maintained development branch
        run: git switch -C 11.x
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, curl, zip, pdo_sqlite, gmp
          tools: composer:2.10.3
          coverage: none
      - name: Resolve with normal security and platform policy
        run: composer update --no-interaction --no-progress
      - name: Audit dependency graph
        run: composer audit --locked
      - name: Token, mail, filesystem and renderer regressions
        run: php vendor/bin/phpunit --bootstrap vendor/autoload.php --log-junit security.xml tests/Auth/AuthTokenGuardTest.php tests/Integration/Filesystem/ServeFileTest.php tests/Security
      - name: Signed route integration
        run: php vendor/bin/phpunit --bootstrap vendor/autoload.php --log-junit signing.xml tests/Integration/Routing/UrlSigningTest.php
      - name: Bounded route generation compatibility
        run: php vendor/bin/phpunit --bootstrap vendor/autoload.php --log-junit routing.xml --filter 'testBasicRouteGeneration|testRoutableInterface|testRoutesWithDomains|testSigned|testRouteParametersContaining' tests/Routing/RoutingUrlGeneratorTest.php
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: security-php-${{ matrix.php }}
          path: |
            security.xml
            signing.xml
            routing.xml
